  - component: mouse
    version: v1.00.00
    file: CM2856_Mouse_USB_v1.00.00_20220810.hex
    sha256: 2c5c1672ca0415a8f557c8a1dda3b71390fb2b97a226f3fc3cde78e01d188a92
    url: https://gloriouscore.nyc3.digitaloceanspaces.com
    inside: v1.0.0.0_20220810_Series_One_ProFirmware.exe > XVI.zip (password XVI)
