# yaml-language-server: $schema=../../schema/device.schema.json
# Structured summary of this folder. Details and evidence are in the files under `docs`.
name: Glorious Series One Pro Wireless
vendor: Glorious
oem: Compx Technology (Shenzhen)
fcc_id: 2AXP2-SP22
platform: compx-nrf52

usb:
  - role: application
    vid_pid: "258a:2018"
    bcd_device: "0x0101"
    manufacturer: Glorious
    product: Series One PRO Wireless
    firmware_version: v1.0.0.0
    report_descriptor_lengths: [91, 163, 20]
    evidence: verified
    source: lsusb -v and /sys/class/hidraw/*/device/report_descriptor on a real mouse, wired, full-speed, 2026-11-12
  - role: receiver-application
    vid_pid: "258a:2031"
    bcd_device: "0x0100"
    product: Series One PRO Wireless
    report_descriptor_lengths: [91, 163, 20]
    evidence: verified
    source: lsusb -v on a real receiver, 2026-11-12; descriptor lengths from /sys/class/hidraw/*/device/report_descriptor, 2026-11-13; relaying and local commands in receiver.md
  - role: bootloader
    vid_pid: "258a:2103"
    manufacturer: Glorious
    product: Glorious bootloader
    evidence: verified
    source: lsusb on a retail mouse after compx_usb_flasher.py dump sent the updater's SetBLDeviceMode packet, 2026-11-13; GetBLFW answered b0 01 00 00
  - role: receiver-bootloader
    vid_pid: "258a:2113"
    evidence: inferred
    source: PID constant in FirmwareUpdate.exe (Form1::InitDevice, C52840Dongle) and BLPID = 2113 in the wireless Config.ini; the receiver application enters it on its own command 0x00 with mode 0xB0, storing 0xA55AA55A at 0x20007FFC (CM2856_Receiver_USB_v1.00.00_20220810.hex @ 0x0000C7A8, disassembly; never sent, see receiver.md); not yet seen enumerating

mcu:
  - component: mouse
    part: Nordic nRF52840-QIAA-D0 (1 MB flash, 256 KB RAM, silicon rev 2)
    marking: N52840 QIAAD0 2144MX
    evidence: verified
    source: U1 marking in FCC internal photos (https://fccid.io/2AXP2SP22)
  - component: receiver
    part: Nordic nRF52 series with USB (nRF52840 per the updater; its 32 KB RAM use also fits an nRF52820)
    evidence: inferred
    source: updater class C52840Dongle and ChipName 00052840 in the wireless Config.ini; the receiver .hex has initial SP 0x200026E0 and its bootloader magic at 0x20007FFC (top of 32 KB) and uses no flash above 0x38FFF; no receiver photo checked

sensor:
  part: PixArt PAW3370 derivative (Glorious BAMF)
  marking: BAMF 2152
  evidence: inferred
  source: marking read from FCC internal photos (verified); PAW3370 lineage from package shape and the stock SPI register driver at CM2856_Mouse_USB_v1.00.00_20220810.hex @ 0x0001708C

firmware:
