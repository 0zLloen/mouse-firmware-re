# Zephyr configuration for Compx nRF52 2.4 GHz passive sniffer (nRF52840 USB Dongle, PCA10059)
# Uses raw NRF_RADIO (no Bluetooth / ESB stack) and USB CDC-ACM for control + packet streaming.

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Compx 2.4G Sniffer"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_CLOCK_CONTROL=y
CONFIG_GPIO=y

# Keep logs off the CDC-ACM capture stream
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
